[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zaddesh-core"
version = "0.1.0"
description = "ZadDesh Monitoring Core Server and API Engine"
authors = [{ name = "ZadDesh Core Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.3",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pymongo>=4.11,<5",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=6",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["zaddesh_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

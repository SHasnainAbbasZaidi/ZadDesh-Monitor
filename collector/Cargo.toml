[package]
name = "zaddesh-collector"
version = "0.1.0"
edition = "2021"
authors = ["ZadDesh Core Team"]
description = "High-concurrency async polling and probing engine for ZadDesh"

[dependencies]
tokio = { version = "1.37", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
snmp2 = { version = "0.5.2", features = ["tokio", "crypto-rust", "heap_buffers"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 4
strip = true




